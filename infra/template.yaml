AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Privacy-conscious Save2Serve MVP API, data, identity, and follow-up infrastructure.

Parameters:
  ApiStageName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-zA-Z0-9_-]+$'
  AllowedWebOrigin:
    Type: String
    Description: Exact HTTPS origin allowed to call the API, with no path or trailing slash.
    AllowedPattern: '^https://[^/]+$'
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito managed login domain.
    AllowedPattern: '^[a-z0-9-]+$'
  CognitoCallbackUrls:
    Type: CommaDelimitedList
    Description: Exact browser callback URLs for the public leader portal client.
  CognitoLogoutUrls:
    Type: CommaDelimitedList
    Description: Exact browser sign-out URLs for the public leader portal client.
  SesSenderEmail:
    Type: String
    Description: Email identity to verify in SES in this stack's deployment region.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  UnsubscribePageUrl:
    Type: String
    Description: HTTPS confirmation page that accepts recordId, recordType, and token.
    AllowedPattern: '^https://.+$'
  FollowUpMaxConcurrency:
    Type: Number
    Description: Maximum concurrent follow-up workers, limiting downstream SES and DynamoDB usage.
    Default: 2
    MinValue: 1
    MaxValue: 10
  EnableBedrockDrafts:
    Type: String
    Description: Opt in to the leader-only Bedrock drafting helper; model usage may incur charges.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  BedrockModelId:
    Type: String
    Description: Foundation model ID enabled in this deployment region.
    Default: amazon.nova-micro-v1:0

Conditions:
  CreateBedrockDrafts: !Equals [!Ref EnableBedrockDrafts, 'true']

Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 20
    Architectures:
      - x86_64
    Environment:
      Variables:
        SAVED2SERVE_TABLE_NAME: !Ref Saved2ServeRecords
        SAVED2SERVE_KMS_KEY_ID: !GetAtt Saved2ServeDataKey.Arn
    Tags:
      Application: Saved2ServeConnect
      ManagedBy: AWS-SAM

Resources:
  OperationalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-operational-alerts'
      Tags:
        - Key: Application
          Value: Saved2ServeConnect

  Saved2ServeDataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts Saved2Serve DynamoDB records and selected contact fields.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Application
          Value: Saved2ServeConnect

  Saved2ServeRecords:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-records'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AreaCreatedAtIndex
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: EmailHashIndex
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt Saved2ServeDataKey.Arn
      Tags:
        - Key: Application
          Value: Saved2ServeConnect

  FollowUpDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-follow-up-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: Saved2ServeConnect

  FollowUpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-follow-up'
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FollowUpDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Application
          Value: Saved2ServeConnect

  FollowUpUnsubscribeSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC secret for Save2Serve follow-up unsubscribe tokens.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: Saved2ServeConnect

  SesSenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SesSenderEmail

  LeaderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-leaders'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolTags:
        Application: Saved2ServeConnect

  LeaderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      Description: Administratively assigned Save2Serve leaders.
      GroupName: Leaders
      Precedence: 10
      UserPoolId: !Ref LeaderUserPool

  LeaderApiResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: saved2serve
      Name: Save2Serve leader API
      Scopes:
        - ScopeName: leader.read
          ScopeDescription: Read the private leader engagement queue.
        - ScopeName: leader.write
          ScopeDescription: Review a pending engagement.
      UserPoolId: !Ref LeaderUserPool

  LeaderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: LeaderApiResourceServer
    Properties:
      ClientName: !Sub '${AWS::StackName}-leader-portal'
      UserPoolId: !Ref LeaderUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - saved2serve/leader.read
        - saved2serve/leader.write
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !Ref CognitoCallbackUrls
      LogoutURLs: !Ref CognitoLogoutUrls
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  LeaderUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref LeaderUserPool

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 30

  Saved2ServeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref ApiStageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedWebOrigin
        AllowHeaders:
          - Authorization
          - Accept
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
        AllowCredentials: false
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${LeaderUserPool}'
              audience:
                - !Ref LeaderUserPoolClient
            IdentitySource: '$request.header.Authorization'

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../
      Handler: com.saved2serve.lambda.ApiRouterHandler::handleRequest
      Timeout: 30
      Environment:
        Variables:
          SAVED2SERVE_FOLLOW_UP_QUEUE_URL: !Ref FollowUpQueue
          SAVED2SERVE_UNSUBSCRIBE_SIGNING_SECRET: !Sub '{{resolve:secretsmanager:${FollowUpUnsubscribeSigningSecret}:SecretString}}'
          SAVED2SERVE_BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt Saved2ServeRecords.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt Saved2ServeRecords.Arn
                - !Sub '${Saved2ServeRecords.Arn}/index/EmailHashIndex'
                - !Sub '${Saved2ServeRecords.Arn}/index/AreaCreatedAtIndex'
                - !Sub '${Saved2ServeRecords.Arn}/index/StatusCreatedAtIndex'
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt Saved2ServeDataKey.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt FollowUpQueue.Arn
            - !If
              - CreateBedrockDrafts
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:*'
      Events:
        CreateInterest:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/interests
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        CreateEngagement:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/engagements
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        ListChurches:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/churches
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        ListDevotions:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/devotions
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        WithdrawFollowUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/follow-ups/withdraw
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
        ListLeaderEngagements:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/admin/engagements
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - saved2serve/leader.read
        ReviewLeaderEngagement:
          Type: HttpApi
          Properties:
            ApiId: !Ref Saved2ServeApi
            Path: /v1/admin/engagements/{id}
            Method: PATCH
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - saved2serve/leader.write
        GenerateLeaderDraft: !If
          - CreateBedrockDrafts
          - Type: HttpApi
            Properties:
              ApiId: !Ref Saved2ServeApi
              Path: /v1/admin/drafts
              Method: POST
              PayloadFormatVersion: '2.0'
              Auth:
                Authorizer: CognitoJwtAuthorizer
                AuthorizationScopes:
                  - saved2serve/leader.write
          - !Ref AWS::NoValue

  FollowUpDeliveryFunction:
    Type: AWS::Serverless::Function
    DependsOn: FollowUpDeliveryLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-follow-up-delivery'
      CodeUri: ../
      Handler: com.saved2serve.lambda.FollowUpDeliveryHandler::handleRequest
      Timeout: 30
      ReservedConcurrentExecutions: !Ref FollowUpMaxConcurrency
      Environment:
        Variables:
          SAVED2SERVE_SES_FROM_ADDRESS: !Ref SesSenderEmail
          SAVED2SERVE_UNSUBSCRIBE_SIGNING_SECRET: !Sub '{{resolve:secretsmanager:${FollowUpUnsubscribeSigningSecret}:SecretString}}'
          SAVED2SERVE_UNSUBSCRIBE_URL: !Ref UnsubscribePageUrl
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt Saved2ServeRecords.Arn
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt Saved2ServeDataKey.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSenderEmail}'
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt FollowUpQueue.Arn
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-follow-up-delivery:*'
      Events:
        FollowUpQueueMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt FollowUpQueue.Arn
            BatchSize: 10
            ScalingConfig:
              MaximumConcurrency: !Ref FollowUpMaxConcurrency
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 30

  FollowUpDeliveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-follow-up-delivery'
      RetentionInDays: 30

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-operations'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API requests and server errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiId", "${Saved2ServeApi}", "Stage", "${ApiStageName}", { "label": "Requests" } ],
                  [ ".", "5xx", ".", ".", ".", ".", { "label": "5xx responses" } ],
                  [ ".", "4xx", ".", ".", ".", ".", { "label": "4xx responses" } ]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda errors and throttles",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${AWS::StackName}-api", { "label": "API errors" } ],
                  [ ".", "Errors", ".", "${AWS::StackName}-follow-up-delivery", { "label": "Follow-up worker errors" } ],
                  [ ".", "Throttles", ".", "${AWS::StackName}-api", { "label": "API throttles" } ]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Follow-up queue processing",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/SQS", "NumberOfMessagesSent", "QueueName", "${AWS::StackName}-follow-up", { "label": "Sent" } ],
                  [ ".", "NumberOfMessagesReceived", ".", ".", { "label": "Received" } ],
                  [ ".", "NumberOfMessagesDeleted", ".", ".", { "label": "Deleted" } ]
                ]
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Queue age and dead-letter backlog",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 300,
                "metrics": [
                  [ "AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${AWS::StackName}-follow-up", { "label": "Oldest message age (seconds)" } ],
                  [ ".", "ApproximateNumberOfMessagesVisible", ".", "${AWS::StackName}-follow-up-dlq", { "label": "DLQ messages" } ]
                ]
              }
            }
          ]
        }

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-5xx'
      AlarmDescription: API Gateway returned at least five 5XX responses in five minutes; inspect the operations dashboard and affected Lambda logs.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref Saved2ServeApi
        - Name: Stage
          Value: !Ref ApiStageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic

  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-errors'
      AlarmDescription: API Lambda recorded an error in five minutes; correlate with API 5XX and structured error events.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic

  FollowUpDeliveryErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-follow-up-delivery-errors'
      AlarmDescription: Follow-up Lambda recorded an invocation error; check partial batch failures, SQS age, DLQ, SES health, and retry limits.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FollowUpDeliveryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic

  FollowUpQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-follow-up-queue-age'
      AlarmDescription: The oldest follow-up message has been waiting at least 15 minutes; check worker errors, retries, and SES health.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FollowUpQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic

  FollowUpDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-follow-up-dead-letter-messages'
      AlarmDescription: At least one follow-up message reached the DLQ; inspect failure cause before controlled redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FollowUpDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic

Outputs:
  ApiBaseUrl:
    Description: HTTPS base URL for the deployed API.
    Value: !Sub 'https://${Saved2ServeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}'
  DynamoDbTableName:
    Value: !Ref Saved2ServeRecords
  KmsKeyArn:
    Value: !GetAtt Saved2ServeDataKey.Arn
  FollowUpQueueUrl:
    Value: !Ref FollowUpQueue
  FollowUpDeadLetterQueueUrl:
    Value: !Ref FollowUpDeadLetterQueue
  CognitoUserPoolId:
    Value: !Ref LeaderUserPool
  CognitoAppClientId:
    Value: !Ref LeaderUserPoolClient
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${LeaderUserPool}'
  CognitoHostedUiDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  SesIdentityArn:
    Value: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSenderEmail}'
  OperationsDashboardName:
    Value: !Ref OperationsDashboard
  OperationalAlertsTopicArn:
    Value: !Ref OperationalAlertsTopic